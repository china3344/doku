<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;

#game {

/* 画面 */

.screen {
    display: none;
}

.screen.active {
    display: block;
}

/* ボックス */

.box {
    background: #151519;

    border: 1px solid #333;

    border-radius: 15px;

    padding: 40px 30px;

    box-shadow:
        0 20px 60px rgba(0,0,0,0.5);

/* タイトル */

.title {
    font-size: 60px;

    text-align: center;

    letter-spacing: 10px;

    margin-bottom: 20px;
}

.description {
    text-align: center;

    color: #999;

    line-height: 1.8;

    margin-bottom: 35px;
}

/* 名前入力 */

input {
    width: 100%;

    padding: 17px;

    background: #0c0c0f;

    border: 1px solid #555;

    border-radius: 8px;

    color: white;

    font-size: 18px;

    outline: none;

    margin-bottom: 15px;
}

/* ボタン */

button {
    width: 100%;

    padding: 17px;

    border-radius: 8px;

    border: 1px solid #555;

    background: #242428;

    color: white;

    font-size: 18px;

    cursor: pointer;
}

button:hover {
    background: #333;
}

button:active {
    transform: scale(0.98);
}

/* 質問 */

.question-number {
    color: #777;

    font-size: 14px;

    margin-bottom: 20px;
}

.question {
    font-size: 28px;

    line-height: 1.6;

    margin-bottom: 30px;
}

/* 回答 */

.answers {
    display: flex;

    flex-direction: column;

    gap: 12px;
}

/* プログレス */

.progress {
    width: 100%;

    height: 3px;

    background: #29292d;

    margin-bottom: 30px;
}

.progress-bar {
    height: 100%;

    background: white;

    width: 0%;

    transition: width 0.3s;
}

/* 結果 */

.result-name {
    color: #999;

    text-align: center;
}

.score {
    font-size: 80px;

    font-weight: bold;

    text-align: center;

    margin-top: 10px;
}

.point-text {
    text-align: center;

    color: #777;

    letter-spacing: 5px;
}

.rank {
    text-align: center;

    margin: 30px 0;

    font-size: 20px;
}

.rank-number {
    font-size: 45px;

    font-weight: bold;
}

/* 注意書き */

.note {
    color: #666;

    font-size: 12px;

    line-height: 1.7;

    text-align: center;

    margin-top: 25px;
}
</style>

/*

let playerName = "";

let currentQuestion = 0;

let totalScore = 0;



/*
==================================================
画面切り替え
==================================================
*/


function changeScreen(screenId) {

    document
        .querySelectorAll(".screen")
        .forEach(screen => {

            screen.classList.remove("active");

        });


    document
        .getElementById(screenId)
        .classList.add("active");

}



/*
==================================================
ゲーム開始
==================================================
*/


function startGame() {

    const input =
        document.getElementById("nameInput");

    const name =
        input.value.trim();


    if (name === "") {

        alert("名前を入力してください。");

        return;

    }


    playerName = name;

    currentQuestion = 0;

    totalScore = 0;


    // BGM開始
    bgm.currentTime = 0;

    bgm.play().catch(error => {
        console.log("BGM再生エラー:", error);
    });


    changeScreen("questionScreen");

    showQuestion();

}

    const name =
        input.value.trim();


    if (name === "") {

        alert("名前を入力してください。");

        return;

    }


    playerName = name;

    currentQuestion = 0;

    totalScore = 0;


    changeScreen("questionScreen");

}



/*

==================================================
*/


function showQuestion() {

    const data =
        questions[currentQuestion];


    document
        .getElementById("questionNumber")
        .textContent =
        "QUESTION " +
        (currentQuestion + 1) +
        " / " +
        questions.length;


    document
        .getElementById("questionText")
        .textContent =
        data.question;


    /*
    プログレスバー
    */

    const progress =
        (currentQuestion / questions.length) * 100;


    document
        .getElementById("progressBar")
        .style.width =
        progress + "%";


    /*
    回答ボタン生成
    */

    const answers =
        document.getElementById("answers");


    answers.innerHTML = "";


    data.answers.forEach(
        (answer, index) => {


            const button =
                document.createElement("button");


            button.textContent =
                answer;


            button.onclick =
                function() {

                    answerQuestion(index);

                };


            answers.appendChild(button);

        }
    );

}



/*
==================================================
回答処理
==================================================
*/


function answerQuestion(answerIndex) {

    const data =
        questions[currentQuestion];


    // 回答SE
    seAnswer.currentTime = 0;
    seAnswer.play().catch(error => {
        console.log("SE再生エラー:", error);
    });


    /*
    ここで内部的に加点。

    プレイヤーには表示しない。
    */

    totalScore +=
        data.points[answerIndex];


    currentQuestion++;


    if (
        currentQuestion >=
        questions.length
    ) {

        finishGame();

    }

    else {

        showQuestion();

    }

}

async function finishGame() {

    document
        .getElementById("progressBar")
        .style.width = "100%";

    document
        .getElementById("resultName")
        .textContent =
        playerName + " さんの結果";

    document
        .getElementById("score")
        .textContent =
        totalScore;

    await saveRanking();

    const rank = await getPlayerRank();

    document
        .getElementById("rankNumber")
        .textContent =
        rank;

    changeScreen("resultScreen");
}

/*
==================================================
ランキング保存・取得
==================================================
*/

async function getRanking() {

    const client = getSupabase();

    const { data, error } = await client
        .from("ranking")
        .select("id, name, score, created_at")
        .order("score", { ascending: false })
        .limit(100);

    if (error) {
        console.error("ランキング取得エラー:", error);
        return [];
    }

    return data || [];
}


async function saveRanking() {

    const client = getSupabase();

    const { error } = await client
        .from("ranking")
        .insert({
            name: playerName,
            score: totalScore
        });

    if (error) {
        console.error("ランキング保存エラー:", error);
        alert("ランキングの保存に失敗しました。");
        return false;
    }

    return true;
}


async function getPlayerRank() {

    const ranking = await getRanking();

    const index = ranking.findIndex(
        player =>
            player.name === playerName &&
            player.score === totalScore
    );

    return index >= 0
        ? index + 1
        : ranking.length + 1;
}
    
async function showRanking() {

    changeScreen("rankingScreen");

    const container =
        document.getElementById("rankingList");

    container.innerHTML = "読み込み中...";

    const ranking = await getRanking();

    container.innerHTML = "";

    if (ranking.length === 0) {
        container.textContent =
            "まだランキングがありません。";
        return;
    }

    ranking
        .slice(0, 20)
        .forEach((player, index) => {

            const row =
                document.createElement("div");

            row.style.display = "flex";
            row.style.justifyContent = "space-between";
            row.style.padding = "14px 5px";
            row.style.borderBottom = "1px solid #333";

            row.innerHTML =
                "<span>" +
                (index + 1) +
                "位　" +
                escapeHTML(player.name) +
                "</span>" +

                "<span>" +
                player.score +
                " POINT" +
                "</span>";

            container.appendChild(row);
        });
}



/*
==================================================
HTMLエスケープ
==================================================
*/


function escapeHTML(text) {

    return text.replace(
        /[&<>"']/g,

        function(character) {

            const map = {

                "&": "&amp;",

                "<": "&lt;",

                ">": "&gt;",

                '"': "&quot;",

                "'": "&#039;"

            };


            return map[character];

        }
    );

}
